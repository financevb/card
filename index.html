<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베이비빌리 공용카드 내역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#3182F6;--blue-600:#2272EB;--blue-50:#E8F3FF;--blue-100:#C9E2FF;
  --gray:#8B95A1;--gray-900:#191F28;--gray-800:#333D4B;--gray-700:#4E5968;--gray-600:#6B7684;--gray-400:#B0B8C1;--gray-300:#D1D6DB;--gray-200:#E5E8EB;--gray-100:#F2F4F6;--gray-50:#F9FAFB;
  --red:#F04452;--orange:#FA9600;--green:#02A262;
  --sh-s:0 1px 3px rgba(0,0,0,.05);--sh-l:0 4px 16px rgba(0,0,0,.08);--sh-blue:0 2px 8px rgba(49,130,246,.25);
  --font:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--gray-50);color:var(--gray-900);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:60px;}
button{font-family:inherit;}
.mono{font-variant-numeric:tabular-nums;}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 0;}

header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand .logo{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;box-shadow:var(--sh-blue);flex-shrink:0;}
.brand-eyebrow{font-size:12px;color:var(--gray);font-weight:500;margin:0 0 2px;}
h1{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:0;color:var(--gray-900);}
.subtitle{color:var(--gray);font-size:13px;margin:5px 0 0;}

#adminBtn{height:36px;padding:0 14px;border-radius:8px;border:none;background:var(--gray-100);color:var(--gray-700);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s;}
#adminBtn:hover{background:var(--gray-200);}
#adminBtn.on{background:var(--blue);color:#fff;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:14px 18px 14px 22px;}
.stat::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--gray-300);}
.stat:nth-child(1)::before{background:var(--blue);}
.stat:nth-child(2)::before{background:var(--orange);}
.stat:nth-child(3)::before{background:var(--green);}
.stat .label{font-size:12.5px;color:var(--gray-600);margin-bottom:4px;}
.stat .value{font-size:20px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;color:var(--gray-900);}
.stat .value.warm{color:var(--orange);}
.stat .value.accent{color:var(--gray-900);}

.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--gray-100);padding:4px;border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto;}
.tab{padding:0 16px;height:36px;font-size:14px;font-weight:600;color:var(--gray-600);cursor:pointer;border:none;border-radius:9px;background:none;white-space:nowrap;transition:.12s;}
.tab:hover{color:var(--gray-900);}
.tab.active{background:#fff;color:var(--gray-900);font-weight:700;box-shadow:var(--sh-s);}
.tab.hidden{display:none;}
.hidden{display:none !important;}

.panel{display:none;}
.panel.active{display:block;}

.card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;box-shadow:var(--sh-s);padding:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:8px;}
.field input,.field select,.field textarea{width:100%;height:48px;padding:0 14px;border:1px solid var(--gray-200);border-radius:12px;font-size:14px;font-family:inherit;background:#fff;color:var(--gray-900);}
.field input::placeholder{color:var(--gray-400);}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-100);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.submitBtn{height:48px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:.12s;}
.submitBtn:hover{background:var(--blue-600);}
.submitBtn:disabled{opacity:.45;cursor:not-allowed;}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filters select{height:36px;padding:0 10px;border:1px solid var(--gray-200);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--gray-800);cursor:pointer;}

.ticket{position:relative;background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh-s);transition:.12s;}
.ticket:hover{border-color:var(--blue-100);}
.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.ticket-merchant{font-weight:700;font-size:15px;color:var(--gray-900);}
.ticket-meta{font-size:12px;color:var(--gray);margin-top:3px;}
.ticket-amount{font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--gray-900);}
.ticket-purpose{font-size:13px;color:var(--gray-700);margin-top:10px;background:var(--gray-50);border-radius:8px;padding:8px 11px;}
.ticket-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;}
.intern-badge{display:inline-flex;align-items:center;height:24px;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-50);padding:0 10px;border-radius:999px;}
.confirm-wrap{display:flex;align-items:center;gap:6px;}
.confirm-wrap input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}
.confirm-wrap label{font-size:12.5px;color:var(--gray-600);user-select:none;cursor:pointer;}
.stamp{position:absolute;top:-9px;right:16px;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:999px;background:#E6F6EE;color:var(--green);font-size:11.5px;font-weight:700;}
.stamp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.delBtn,.editBtn{height:28px;padding:0 11px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.editBtn{background:var(--gray-100);color:var(--gray-700);}
.editBtn:hover{background:var(--gray-200);}
.delBtn{background:#fff;color:var(--red);border:1px solid #f7c9c9;}
.delBtn:hover{background:#fdecec;}

.empty{text-align:center;padding:54px 20px;color:var(--gray);background:#fff;border:1px solid var(--gray-200);border-radius:16px;}
.card .empty{border:none;padding:40px 10px;}
.empty .big{font-size:16px;font-weight:700;color:var(--gray-800);margin-bottom:6px;}

.summary-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100);gap:12px;}
.summary-row:last-child{border-bottom:none;}
.summary-name{font-weight:700;font-size:14px;min-width:80px;}
.summary-bar-wrap{flex:1;background:var(--gray-100);border-radius:6px;height:10px;overflow:hidden;}
.summary-bar{height:100%;background:var(--blue);border-radius:6px;}
.summary-total{font-weight:700;font-size:14px;min-width:100px;text-align:right;font-variant-numeric:tabular-nums;}
.summary-unconfirmed{font-size:11.5px;font-weight:600;color:var(--orange);min-width:60px;text-align:right;}

.intern-manage-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.intern-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--gray-200);border-radius:999px;padding:5px 7px 5px 14px;font-size:13px;font-weight:700;}
.intern-chip .pin-tag{font-size:11px;font-weight:500;color:var(--gray);background:var(--gray-100);border-radius:999px;padding:2px 8px;}
.intern-chip .pin-tag.set{color:var(--blue);background:var(--blue-50);}
.intern-chip .iconbtn{background:#fff;border:1px solid var(--gray-300);color:var(--gray-600);border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:700;cursor:pointer;line-height:1;}
.intern-chip .iconbtn:hover{border-color:var(--blue);color:var(--blue);}
.intern-chip button.remove{background:var(--gray-100);color:var(--gray-600);border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1;}
.intern-chip button.remove:hover{background:#fdecec;color:var(--red);}
.pinField{display:flex;gap:8px;}
.pinField input{flex:1;}
.hint{font-size:12px;color:var(--gray);margin-top:6px;}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.edit-grid input{height:40px;padding:0 12px;border:1px solid var(--gray-200);border-radius:10px;font-size:13px;font-family:inherit;width:100%;}
.edit-grid input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-100);}
.edit-actions{display:flex;gap:8px;margin-top:12px;}
.edit-actions button{height:34px;border:none;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.editSaveBtn{background:var(--blue);color:#fff;}
.editSaveBtn:hover{background:var(--blue-600);}
.editCancelBtn{background:var(--gray-100);color:var(--gray-700);}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:13px 22px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--sh-l);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
.toast.show{opacity:1;}

.errorBanner{background:#fdecec;border:1px solid #f7c9c9;color:#c23b42;padding:11px 15px;border-radius:12px;font-size:13px;margin-bottom:16px;}
.configBanner{background:#fff7ed;border:1px solid #ffe2bb;color:#8a5300;padding:14px;border-radius:12px;font-size:13px;margin-bottom:16px;line-height:1.6;}

.ov{position:fixed;inset:0;background:rgba(25,31,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.14);width:100%;max-width:380px;padding:24px;}
.modal h2{font-size:18px;font-weight:700;margin:0 0 6px;}
.modal p.desc{font-size:13px;color:var(--gray-600);margin:0 0 16px;line-height:1.6;}
.modal .field{margin-bottom:12px;}
.modal .btns{display:flex;gap:8px;margin-top:6px;}
.modal .btns button{flex:1;}
.lineBtn{height:48px;background:var(--gray-100);color:var(--gray-700);border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
.lineBtn:hover{background:var(--gray-200);}
.modal .err{font-size:12.5px;color:var(--red);margin:-4px 0 10px;min-height:1px;}

@media (max-width:640px){
  .wrap{padding:20px 16px 0;}
  .stats{grid-template-columns:1fr;}
  .row2{grid-template-columns:1fr;}
  .pinField{flex-wrap:wrap;}
  h1{font-size:20px;}
  .tabs{width:100%;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">빌</div>
      <div>
        <p class="brand-eyebrow">빌리지베이비 · 베이비빌리</p>
        <h1>공용 법인카드 내역</h1>
      </div>
    </div>
    <button id="adminBtn" onclick="toggleAdmin()">관리자 모드</button>
  </header>

  <div id="errorBox"></div>

  <div class="stats">
    <div class="stat">
      <div class="label">이번 달 총 사용액</div>
      <div class="value accent mono" id="statMonthTotal">0원</div>
    </div>
    <div class="stat">
      <div class="label">미확인 건수</div>
      <div class="value warm mono" id="statUnconfirmed">0건</div>
    </div>
    <div class="stat">
      <div class="label">등록된 인턴 수</div>
      <div class="value mono" id="statInternCount">0명</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="add" onclick="switchTab('add')">내역 입력</button>
    <button class="tab" data-tab="list" onclick="switchTab('list')">전체 내역</button>
    <button class="tab hidden" data-tab="summary" id="summaryTab" onclick="switchTab('summary')">인턴별 요약</button>
    <button class="tab hidden" data-tab="manage" id="manageTab" onclick="switchTab('manage')">명단관리</button>
  </div>

  <div class="panel active" id="panel-add">
    <div class="card">
      <form id="entryForm" onsubmit="return submitEntry(event)">
        <div class="row2">
          <div class="field">
            <label for="f_date">사용일</label>
            <input type="date" id="f_date" required>
          </div>
          <div class="field">
            <label for="f_amount">금액 (원)</label>
            <input type="text" id="f_amount" inputmode="numeric" placeholder="15,000" oninput="formatAmountInput(this)" required>
          </div>
        </div>
        <div class="field">
          <label for="f_card">카드번호 뒷자리 4자리</label>
          <input type="text" id="f_card" inputmode="numeric" maxlength="4" placeholder="예: 1234" pattern="[0-9]{4}" required>
        </div>
        <div class="field">
          <label for="f_merchant">사용처</label>
          <input type="text" id="f_merchant" placeholder="예: 스타벅스 강남점" required>
        </div>
        <div class="field">
          <label for="f_purpose">사용 목적 및 사용자들</label>
          <input type="text" id="f_purpose" placeholder="예: 팀 회의 다과" required>
        </div>
        <div class="field">
          <label for="f_intern">작성자 (본인 이름 입력)</label>
          <input type="text" id="f_intern" placeholder="예: 김민지" required>
        </div>
        <div class="field">
          <label for="f_pin">본인 확인 PIN (생년월일 6자리)</label>
          <input type="password" id="f_pin" inputmode="numeric" maxlength="6" placeholder="생년월일 6자리" required>
          <p class="hint">명단에 등록한 PIN과 같아야 내역이 등록돼요.</p>
        </div>
        <button type="submit" class="submitBtn" id="submitBtn">내역 등록</button>
      </form>
    </div>
  </div>

  <div class="panel" id="panel-list">
    <div class="filters">
      <select id="filterIntern" class="hidden" onchange="renderList()">
        <option value="">전체 인턴</option>
      </select>
      <select id="filterStatus" onchange="renderList()">
        <option value="">전체 상태</option>
        <option value="confirmed">확인완료만</option>
        <option value="unconfirmed">미확인만</option>
      </select>
    </div>
    <div id="listContainer"></div>
  </div>

  <div class="panel" id="panel-summary">
    <div class="card" id="summaryContainer"></div>
  </div>

  <div class="panel" id="panel-manage">
    <div class="card">
      <div class="field" style="margin-bottom:10px;">
        <label for="newInternName">인턴 이름 / PIN 추가</label>
        <div class="pinField">
          <input type="text" id="newInternName" placeholder="이름 (예: 김민지)" onkeydown="if(event.key==='Enter'){event.preventDefault(); addIntern();}">
          <input type="text" id="newInternPin" inputmode="numeric" maxlength="6" placeholder="PIN 6자리 (생년월일)" onkeydown="if(event.key==='Enter'){event.preventDefault(); addIntern();}">
          <button class="submitBtn" style="width:auto; padding:10px 18px;" onclick="addIntern()">추가</button>
        </div>
        <p class="hint">PIN은 인턴 본인이 카드내역을 등록·수정할 때 본인 확인용으로 쓰여요.</p>
      </div>
      <div class="intern-manage-list" id="internManageList"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="ov hidden" id="loginOv" onclick="if(event.target===this)closeLogin()">
  <div class="modal">
    <h2>관리자 로그인</h2>
    <p class="desc" id="loginDesc">관리자 이메일로 인증 메일을 보내드려요.</p>
    <div id="stepEmail">
      <div class="field">
        <label for="loginEmail">관리자 이메일</label>
        <input type="email" id="loginEmail" value="cy.j@villagebaby.kr" onkeydown="if(event.key==='Enter')sendLogin()">
      </div>
      <div class="err" id="loginErr1"></div>
      <div class="btns"><button class="lineBtn" onclick="closeLogin()">취소</button><button class="submitBtn" id="sendBtn" onclick="sendLogin()">인증 메일 받기</button></div>
    </div>
    <div id="stepCode" class="hidden">
      <div class="field">
        <label for="loginCode">메일로 받은 인증 코드</label>
        <input type="text" id="loginCode" inputmode="numeric" maxlength="8" placeholder="숫자 코드" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')verifyLogin()">
        <p class="hint">메일에 코드 대신 링크만 있으면, 링크를 누르면 바로 관리자 모드로 들어와요.</p>
      </div>
      <div class="err" id="loginErr2"></div>
      <div class="btns"><button class="lineBtn" onclick="closeLogin()">닫기</button><button class="submitBtn" onclick="verifyLogin()">확인</button></div>
    </div>
  </div>
</div>

<script>
// ====== 여기에 Supabase 프로젝트 정보를 입력하세요 ======
const SUPABASE_URL = "https://giykohijkwybjvyltozo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GB9f_RLPAu9q7uurv3O9-w_ZiqLwxnl";
// =======================================================

const ADMIN_EMAIL = "cy.j@villagebaby.kr"; // 관리자는 이 이메일 한 명뿐 — 메일 인증으로 로그인
let sb = null;
let entries = [];
let interns = [];
let isAdmin = false;
let editingId = null;
const CONFIG_OK = !SUPABASE_URL.startsWith("여기에") && !SUPABASE_ANON_KEY.startsWith("여기에");

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function showError(msg){
  document.getElementById('errorBox').innerHTML = '<div class="errorBanner">' + msg + '</div>';
}
function showConfigNotice(msg){
  document.getElementById('errorBox').innerHTML = '<div class="configBanner">' + msg + '</div>';
}
function clearError(){
  document.getElementById('errorBox').innerHTML = '';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatWon(n){
  return Number(n).toLocaleString('ko-KR') + '원';
}
function formatAmountInput(el){
  const raw = el.value.replace(/[^0-9]/g,'');
  el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
}
function parseAmount(str){
  return Number(String(str).replace(/,/g,'').trim());
}
function findIntern(name){
  return interns.find(i=>i.name===name);
}

async function loadData(){
  if(!CONFIG_OK) return;
  try{
    const { data: internRows, error: e1 } = await sb.from('card_interns').select('*').order('created_at');
    if(e1) throw e1;
    interns = (internRows||[]).map(r=>({ id:r.id, name:r.name, pin:r.pin }));
  }catch(err){
    showError('인턴 명단을 불러오지 못했어요: ' + (err.message||err));
    interns = [];
  }
  try{
    const { data: entryRows, error: e2 } = await sb.from('card_entries').select('*').order('date', {ascending:false});
    if(e2) throw e2;
    entries = (entryRows||[]).map(r=>({
      id:r.id, date:r.date, amount:r.amount, cardLast4:r.card_last4,
      merchant:r.merchant, purpose:r.purpose, intern:r.intern_name,
      confirmed:r.confirmed, createdAt:r.created_at
    }));
    clearError();
  }catch(err){
    showError('카드내역을 불러오지 못했어요: ' + (err.message||err));
    entries = [];
  }
}

function setAdmin(on){
  isAdmin = on;
  const btn = document.getElementById('adminBtn');
  btn.classList.toggle('on', on);
  btn.textContent = on ? '관리자 모드 ON · 로그아웃' : '관리자 모드';
  document.getElementById('manageTab').classList.toggle('hidden', !on);
  document.getElementById('summaryTab').classList.toggle('hidden', !on);
  document.getElementById('filterIntern').classList.toggle('hidden', !on);
  if(!on){
    document.getElementById('filterIntern').value = '';
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    if(activeTab === 'manage' || activeTab === 'summary') switchTab('list');
  }
  renderAll();
}
function isAdminSession(session){
  return !!(session && session.user && String(session.user.email||'').toLowerCase() === ADMIN_EMAIL);
}
async function toggleAdmin(){
  if(isAdmin){
    if(!confirm('관리자 모드를 끝내고 로그아웃할까요?')) return;
    await sb.auth.signOut();
    setAdmin(false);
    showToast('로그아웃했어요');
    return;
  }
  const { data } = await sb.auth.getSession();
  if(isAdminSession(data.session)){ setAdmin(true); showToast('관리자 모드 시작'); return; }
  openLogin();
}
function openLogin(){
  document.getElementById('stepEmail').classList.remove('hidden');
  document.getElementById('stepCode').classList.add('hidden');
  document.getElementById('loginDesc').textContent = '관리자 이메일로 인증 메일을 보내드려요.';
  document.getElementById('loginErr1').textContent = '';
  document.getElementById('loginErr2').textContent = '';
  document.getElementById('loginCode').value = '';
  document.getElementById('loginOv').classList.remove('hidden');
}
function closeLogin(){ document.getElementById('loginOv').classList.add('hidden'); }
async function sendLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const err = document.getElementById('loginErr1');
  if(email !== ADMIN_EMAIL){ err.textContent = '관리자 이메일이 아니에요.'; return; }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '보내는 중...';
  try{
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true, emailRedirectTo: location.origin + location.pathname } });
    if(error) throw error;
    document.getElementById('stepEmail').classList.add('hidden');
    document.getElementById('stepCode').classList.remove('hidden');
    document.getElementById('loginDesc').textContent = email + ' 로 인증 메일을 보냈어요. 메일함을 확인해주세요.';
    setTimeout(()=>document.getElementById('loginCode').focus(), 50);
  }catch(e){
    err.textContent = '메일을 보내지 못했어요: ' + (e.message||e);
  }finally{
    btn.disabled = false; btn.textContent = '인증 메일 받기';
  }
}
async function verifyLogin(){
  const token = document.getElementById('loginCode').value.replace(/\s/g,'');
  const err = document.getElementById('loginErr2');
  if(!/^[0-9]{6,8}$/.test(token)){ err.textContent = '메일에 있는 숫자 코드를 입력해주세요.'; return; }
  const { data, error } = await sb.auth.verifyOtp({ email: ADMIN_EMAIL, token, type:'email' });
  if(error || !isAdminSession(data && data.session)){ err.textContent = '코드가 맞지 않거나 만료됐어요. 다시 받아주세요.'; return; }
  closeLogin(); setAdmin(true); showToast('관리자 모드 시작');
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='list') renderList();
  if(name==='summary') renderSummary();
  if(name==='manage') renderManage();
}

function populateInternSelects(){
  const filt = document.getElementById('filterIntern');
  const currentFilt = filt.value;
  filt.innerHTML = '<option value="">전체 인턴</option>' +
    interns.map(i=>`<option value="${escapeHtml(i.name)}">${escapeHtml(i.name)}</option>`).join('');
  const names = interns.map(i=>i.name);
  if(names.includes(currentFilt)) filt.value = currentFilt;
  document.getElementById('submitBtn').disabled = interns.length===0;
  document.getElementById('submitBtn').textContent = '내역 등록';
}

async function submitEntry(ev){
  ev.preventDefault();
  const date = document.getElementById('f_date').value;
  const amount = parseAmount(document.getElementById('f_amount').value);
  const cardLast4 = document.getElementById('f_card').value.trim();
  const merchant = document.getElementById('f_merchant').value.trim();
  const purpose = document.getElementById('f_purpose').value.trim();
  const intern = document.getElementById('f_intern').value.trim();
  const pin = document.getElementById('f_pin').value.trim();

  if(!date || !amount || !cardLast4 || !merchant || !purpose || !intern || !pin){
    showToast('모든 항목을 입력해주세요'); return false;
  }
  if(!/^[0-9]{4}$/.test(cardLast4)){
    showToast('카드번호 뒷자리는 숫자 4자리로 입력해주세요'); return false;
  }
  const internObj = findIntern(intern);
  if(!internObj){
    showToast('등록된 인턴 명단에 없는 이름이에요. 이름을 정확히 입력했는지 확인해주세요.'); return false;
  }
  if(!internObj.pin){
    showToast('관리자가 아직 이 인턴의 PIN을 등록하지 않았어요'); return false;
  }
  if(internObj.pin !== pin){
    showToast('PIN이 일치하지 않아요'); return false;
  }

  try{
    const { error } = await sb.from('card_entries').insert({
      date, amount, card_last4: cardLast4, merchant, purpose,
      intern_name: intern, confirmed: false
    });
    if(error) throw error;
    await loadData();
    document.getElementById('entryForm').reset();
    document.getElementById('f_date').valueAsDate = new Date();
    showToast('카드내역이 등록되었어요');
    renderAll();
  }catch(err){
    showError('등록에 실패했어요: ' + (err.message||err));
  }
  return false;
}

async function toggleConfirm(id){
  if(!isAdmin){ showToast('관리자 모드에서만 확인 처리할 수 있어요'); return; }
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  try{
    const { error } = await sb.from('card_entries').update({ confirmed: !e.confirmed }).eq('id', id);
    if(error) throw error;
    await loadData();
    renderAll();
  }catch(err){
    showError('업데이트에 실패했어요: ' + (err.message||err));
  }
}

async function deleteEntry(id){
  if(!isAdmin){ showToast('관리자 모드에서만 삭제할 수 있어요'); return; }
  if(!confirm('이 내역을 삭제할까요? 되돌릴 수 없어요.')) return;
  try{
    const { error } = await sb.from('card_entries').delete().eq('id', id);
    if(error) throw error;
    await loadData();
    renderAll();
  }catch(err){
    showError('삭제에 실패했어요: ' + (err.message||err));
  }
}

async function addIntern(){
  const nameInput = document.getElementById('newInternName');
  const pinInput = document.getElementById('newInternPin');
  const name = nameInput.value.trim();
  const pin = pinInput.value.trim();
  if(!name){ showToast('이름을 입력해주세요'); return; }
  if(interns.some(i=>i.name===name)){ showToast('이미 등록된 이름이에요'); return; }
  if(!pin || !/^[0-9]{6}$/.test(pin)){ showToast('PIN은 숫자 6자리로 입력해주세요'); return; }
  try{
    const { error } = await sb.from('card_interns').insert({ name, pin });
    if(error) throw error;
    await loadData();
    nameInput.value=''; pinInput.value='';
    showToast(name + ' 님을 추가했어요');
    renderAll();
    nameInput.focus();
  }catch(err){
    showError('인턴 추가에 실패했어요: ' + (err.message||err));
  }
}

async function removeIntern(id, name){
  if(!confirm(name + ' 님을 명단에서 제거할까요? 기존 카드내역은 유지돼요.')) return;
  try{
    const { error } = await sb.from('card_interns').delete().eq('id', id);
    if(error) throw error;
    await loadData();
    renderAll();
  }catch(err){
    showError('삭제에 실패했어요: ' + (err.message||err));
  }
}

async function changePin(id, name){
  const newPin = prompt(name + ' 님의 새 PIN을 입력하세요 (숫자 6자리)', '');
  if(newPin === null) return;
  if(!/^[0-9]{6}$/.test(newPin.trim())){ showToast('PIN은 숫자 6자리로 입력해주세요'); return; }
  try{
    const { error } = await sb.from('card_interns').update({ pin: newPin.trim() }).eq('id', id);
    if(error) throw error;
    await loadData();
    showToast(name + ' 님의 PIN을 변경했어요');
    renderManage();
  }catch(err){
    showError('PIN 변경에 실패했어요: ' + (err.message||err));
  }
}

function renderManage(){
  const list = document.getElementById('internManageList');
  if(!isAdmin){ list.innerHTML=''; return; }
  if(interns.length===0){
    list.innerHTML = '<p style="color:var(--muted); font-size:13px;">등록된 인턴이 없어요. 위에서 이름을 추가해주세요.</p>';
    return;
  }
  list.innerHTML = interns.map(i=>{
    const pinTag = i.pin ? `<span class="pin-tag set">PIN ****${i.pin.slice(-2)}</span>` : `<span class="pin-tag">PIN 미설정</span>`;
    return `<div class="intern-chip">${escapeHtml(i.name)} ${pinTag}
      <button class="iconbtn" onclick="changePin('${i.id}','${escapeHtml(i.name).replace(/'/g,"\\'")}')" aria-label="PIN 변경" title="PIN 변경">P</button>
      <button class="remove" onclick="removeIntern('${i.id}','${escapeHtml(i.name).replace(/'/g,"\\'")}')" aria-label="삭제">×</button>
    </div>`;
  }).join('');
}

function renderStats(){
  const now = new Date();
  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const monthTotal = entries.filter(e=>e.date && e.date.startsWith(ym))
    .reduce((s,e)=>s+Number(e.amount||0),0);
  const unconfirmed = entries.filter(e=>!e.confirmed).length;
  document.getElementById('statMonthTotal').textContent = formatWon(monthTotal);
  document.getElementById('statUnconfirmed').textContent = unconfirmed + '건';
  document.getElementById('statInternCount').textContent = interns.length + '명';
}

function renderList(){
  const container = document.getElementById('listContainer');
  const filterIntern = document.getElementById('filterIntern').value;
  const filterStatus = document.getElementById('filterStatus').value;

  let list = [...entries].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''));
  if(filterIntern) list = list.filter(e=>e.intern===filterIntern);
  if(filterStatus==='confirmed') list = list.filter(e=>e.confirmed);
  if(filterStatus==='unconfirmed') list = list.filter(e=>!e.confirmed);

  if(list.length===0){
    container.innerHTML = `<div class="empty"><div class="big">아직 카드내역이 없어요</div>등록된 내역이 여기에 영수증처럼 쌓여요.</div>`;
    return;
  }

  container.innerHTML = list.map(e=>{
    if(e.id === editingId){
      return `
    <div class="ticket">
      <div class="ticket-meta mono">${escapeHtml(e.intern)} 님의 내역 수정 중</div>
      <div class="edit-grid">
        <input type="date" id="edit_date_${e.id}" value="${escapeHtml(e.date)}">
        <input type="text" id="edit_amount_${e.id}" value="${Number(e.amount).toLocaleString('ko-KR')}" inputmode="numeric" oninput="formatAmountInput(this)">
        <input type="text" id="edit_card_${e.id}" value="${escapeHtml(e.cardLast4 || '')}" maxlength="4" placeholder="카드 뒷자리 4자리">
        <input type="text" id="edit_merchant_${e.id}" value="${escapeHtml(e.merchant)}" placeholder="사용처">
        <input type="text" id="edit_purpose_${e.id}" value="${escapeHtml(e.purpose)}" placeholder="사용 목적">
      </div>
      <div class="edit-actions">
        <button class="editSaveBtn" onclick="saveEditEntry('${e.id}')">저장</button>
        <button class="editCancelBtn" onclick="cancelEditEntry()">취소</button>
      </div>
    </div>`;
    }
    return `
    <div class="ticket">
      ${e.confirmed ? '<div class="stamp">확인완료</div>' : ''}
      <div class="ticket-top">
        <div>
          <div class="ticket-merchant">${escapeHtml(e.merchant)}</div>
          <div class="ticket-meta mono">${escapeHtml(e.date)} · 카드 끝 ${escapeHtml(e.cardLast4 || '----')}</div>
        </div>
        <div class="ticket-amount">${formatWon(e.amount)}</div>
      </div>
      <div class="ticket-purpose">${escapeHtml(e.purpose)}</div>
      <div class="ticket-bottom">
        <span class="intern-badge">${escapeHtml(e.intern)}</span>
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="editBtn" onclick="editEntry('${e.id}')">수정</button>
          ${isAdmin ? `<button class="delBtn" onclick="deleteEntry('${e.id}')">삭제</button>` : ''}
          <div class="confirm-wrap">
            <input type="checkbox" id="chk_${e.id}" ${e.confirmed?'checked':''} onchange="toggleConfirm('${e.id}')">
            <label for="chk_${e.id}">확인완료</label>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function editEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  if(!isAdmin){
    const internObj = findIntern(e.intern);
    const pin = prompt('본인 확인 PIN을 입력하세요');
    if(pin === null) return;
    if(!internObj || internObj.pin !== pin.trim()){ showToast('PIN이 일치하지 않아요'); return; }
  }
  editingId = id;
  renderList();
}
function cancelEditEntry(){ editingId = null; renderList(); }

async function saveEditEntry(id){
  const date = document.getElementById('edit_date_'+id).value;
  const amount = parseAmount(document.getElementById('edit_amount_'+id).value);
  const cardLast4 = document.getElementById('edit_card_'+id).value.trim();
  const merchant = document.getElementById('edit_merchant_'+id).value.trim();
  const purpose = document.getElementById('edit_purpose_'+id).value.trim();
  if(!date || !amount || !cardLast4 || !merchant || !purpose){
    showToast('모든 항목을 입력해주세요'); return;
  }
  if(!/^[0-9]{4}$/.test(cardLast4)){
    showToast('카드번호 뒷자리는 숫자 4자리로 입력해주세요'); return;
  }
  try{
    const { error } = await sb.from('card_entries').update({
      date, amount, card_last4: cardLast4, merchant, purpose
    }).eq('id', id);
    if(error) throw error;
    editingId = null;
    await loadData();
    showToast('내역을 수정했어요');
    renderAll();
  }catch(err){
    showError('수정에 실패했어요: ' + (err.message||err));
  }
}

function renderSummary(){
  const container = document.getElementById('summaryContainer');
  if(!isAdmin){ container.innerHTML=''; return; }
  if(interns.length===0){
    container.innerHTML = `<div class="empty"><div class="big">등록된 인턴이 없어요</div>관리자 모드에서 인턴 명단을 먼저 등록해주세요.</div>`;
    return;
  }
  const totals = interns.map(i=>{
    const own = entries.filter(e=>e.intern===i.name);
    const total = own.reduce((s,e)=>s+Number(e.amount||0),0);
    const unconfirmed = own.filter(e=>!e.confirmed).length;
    return { name: i.name, total, unconfirmed };
  });
  const max = Math.max(1, ...totals.map(t=>t.total));
  container.innerHTML = totals.sort((a,b)=>b.total-a.total).map(t=>`
    <div class="summary-row">
      <div class="summary-name">${escapeHtml(t.name)}</div>
      <div class="summary-bar-wrap"><div class="summary-bar" style="width:${(t.total/max*100).toFixed(0)}%"></div></div>
      <div class="summary-total mono">${formatWon(t.total)}</div>
      <div class="summary-unconfirmed">${t.unconfirmed>0 ? '미확인 '+t.unconfirmed+'건' : ''}</div>
    </div>
  `).join('');
}

function renderAll(){
  renderStats();
  populateInternSelects();
  renderList();
  renderSummary();
  renderManage();
}

function subscribeRealtime(){
  sb.channel('card_app_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'card_entries' }, async ()=>{ await loadData(); renderAll(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'card_interns' }, async ()=>{ await loadData(); renderAll(); })
    .subscribe();
}

(async function init(){
  document.getElementById('f_date').valueAsDate = new Date();
  if(!CONFIG_OK){
    showConfigNotice('아직 Supabase 연결 정보가 입력되지 않았어요. 코드 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY를 채워주세요.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  await loadData();
  renderAll();
  subscribeRealtime();
  const { data:{ session } } = await sb.auth.getSession();
  if(isAdminSession(session)) setAdmin(true);
  else if(session) await sb.auth.signOut();
  sb.auth.onAuthStateChange((ev, ses)=>{
    if(ev === 'SIGNED_IN' && isAdminSession(ses) && !isAdmin){ closeLogin(); setAdmin(true); showToast('관리자 모드 시작'); }
  });
})();
</script>
</body>
</html>
